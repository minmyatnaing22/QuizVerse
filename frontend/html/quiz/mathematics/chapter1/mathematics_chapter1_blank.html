<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizVerse | Mathematics Chapter 1 Blank</title>
  <link rel="stylesheet" href="../../../../css/quiz_style/quiz_style.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop"></div>
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> QuizVerse <span style="opacity:.55;font-weight:500;font-size:13px;">· Grade 12</span></div>
      <div class="profile-card">
        <div class="avatar-ring"><div class="avatar-fallback">QV</div></div>
        <div class="student-name">Guest</div>
        <div class="student-meta">Mathematics Practice</div>
        <button class="continue-btn">▶ Continue Practice</button>
      </div>
      <nav class="nav-list">
        <a class="nav-item" href="../../../subject/mathematics.html"><span class="subject-name">Back to Chapter Section</span></a>
        <a class="nav-item" href="../../../subject/myanmar.html"><span class="subject-name">Myanmar</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
        <a class="nav-item" href="../../../subject/english.html"><span class="subject-name">English</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
        <a class="nav-item active" href="../../../subject/mathematics.html"><span class="subject-name">Mathematics</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
        <a class="nav-item" href="../../../subject/physics.html"><span class="subject-name">Physics</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
        <a class="nav-item" href="../../../subject/chemistry.html"><span class="subject-name">Chemistry</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
        <a class="nav-item" href="../../../subject/biology.html"><span class="subject-name">Biology</span><span class="progress-meta"><span class="progress-track"><span class="progress-fill" style="width: 0%"></span></span><span class="progress-value">0%</span></span></a>
      </nav>
    </aside>

    <main>
      <div class="mobile-header">
        <div class="mobile-brand"><span class="dot"></span> QuizVerse</div>
        <button class="sidebar-toggle" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>
      </div>

      <div class="top-row">
          <div class="heading-block">
              <h1 id="page-title">Loading...</h1>
              <p id="page-description">Loading quiz...</p>
          </div>
      </div>

      <div class="panel-intro blank-panel">
          <h2 id="quiz-title">Quiz</h2>
          <p id="quiz-description">Loading questions...</p>
      </div>

      <form class="quiz-grid single-column" id="quiz-form">

          <div id="questions-container">
              Loading questions...
          </div>

          <button type="submit" class="submit-btn">
              Submit Answers
          </button>

      </form>
    </main>
  </div>

  <script>
    const sidebarToggle = document.querySelector('.sidebar-toggle');
    const sidebar = document.querySelector('.sidebar');
    const backdrop = document.querySelector('.sidebar-backdrop');

    function setSidebarOpen(isOpen) {
      sidebar.classList.toggle('open', isOpen);
      backdrop.classList.toggle('open', isOpen);
      document.body.classList.toggle('sidebar-open', isOpen);
      sidebarToggle?.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    function toggleSidebar() {
      setSidebarOpen(!sidebar.classList.contains('open'));
    }

    sidebarToggle?.addEventListener('click', toggleSidebar);
    backdrop?.addEventListener('click', () => setSidebarOpen(false));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && sidebar.classList.contains('open')) {
        setSidebarOpen(false);
      }
    });
  </script>
  <script src="../../../../js/quiz.js"></script>
</body>
</html>
