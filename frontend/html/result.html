<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizVerse | Result</title>
  <link rel="stylesheet" href="../css/result_style.css" />
  <link rel="stylesheet" href="../css/achievements_style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop"></div>
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> QuizVerse <span style="opacity:.55;font-weight:500;font-size:13px;">· Grade 12</span></div>
      <div class="profile-card">
        <div class="avatar-ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/><circle cx="44" cy="44" r="40" fill="none" stroke="#FFC93C" stroke-width="6" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="90.4"/></svg><div class="avatar-fallback">QV</div><div class="level-badge">12</div></div>
        <div class="student-name">Guest</div>
        <div class="student-meta" id="student-meta">Practice</div>
        <button class="continue-btn" id="continue-btn">▶ Continue Practice</button>
      </div>
      <nav class="nav-list">
        <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
        <a class="nav-item" id="back-to-subject" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v5h5"/></svg><span id="subject-nav-label">Subject</span></a>
        <a class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5V7h14v10H9l-4 4v-8.5z"/><path d="M8 11h8M8 15h5"/></svg><span>Result</span></a>
      </nav>
    </aside>
    <main>
      <div class="mobile-header"><div class="mobile-brand"><span class="dot"></span> QuizVerse</div><button class="sidebar-toggle" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button></div>
      <div class="top-row"><div class="heading-block"><h1 id="page-title">Quiz Result</h1><p id="page-description">Review your score and answers.</p></div></div>
      <div class="result-summary">
        <div class="summary-card score-card"><span class="summary-label">Total score</span><div class="score-value" id="score-percent">—</div><div class="score-sub" id="score-sub">—</div></div>
        <div class="summary-card"><span class="summary-label">Correct</span><div class="score-value" id="correct-count">—</div><div class="score-sub">Correct answers</div></div>
        <div class="summary-card"><span class="summary-label">Incorrect</span><div class="score-value" id="incorrect-count">—</div><div class="score-sub">Needs practice</div></div>
      </div>
      <div class="result-grid">
        <div class="result-block"><h3>Quick overview</h3>
          <div class="result-item"><span class="meta">Correct</span><strong class="good" id="overview-correct">0</strong></div>
          <div class="result-item"><span class="meta">Incorrect</span><strong class="bad" id="overview-incorrect">0</strong></div>
          <div class="result-item"><span class="meta">Skipped</span><strong id="overview-skipped">0</strong></div>
        </div>
      </div>
      <div class="review-header"><h2>Question Review</h2></div>
      <div class="question-list" id="question-list"></div>
    </main>
  </div>
  <script>
    const sidebarToggle = document.querySelector('.sidebar-toggle');
    const sidebar = document.querySelector('.sidebar');
    const backdrop = document.querySelector('.sidebar-backdrop');
    function setSidebarOpen(isOpen) { sidebar.classList.toggle('open', isOpen); backdrop.classList.toggle('open', isOpen); document.body.classList.toggle('sidebar-open', isOpen); sidebarToggle?.setAttribute('aria-expanded', isOpen ? 'true' : 'false'); }
    sidebarToggle?.addEventListener('click', () => setSidebarOpen(!sidebar.classList.contains('open')));
    backdrop?.addEventListener('click', () => setSidebarOpen(false));
  </script>
  <script src="../js/session.js"></script>
  <script src="../js/achievements-notify.js"></script>
  <script src="../js/result.js"></script>
</body>
</html>
